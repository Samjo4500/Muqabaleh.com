<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none">
  <!-- Classical 8-point najma (star) tessellation tile -->
  <g stroke="#E8C97A" stroke-width="1.05" stroke-linejoin="round">
    <!-- outer octagon frame -->
    <path d="M70 10 H130 L190 70 V130 L130 190 H70 L10 130 V70 Z"/>
    <!-- 8-point star -->
    <path d="M100 28 L114 72 L158 72 L122 98 L136 142 L100 116 L64 142 L78 98 L42 72 L86 72 Z"/>
    <!-- inner diamond lattice -->
    <path d="M100 58 L128 100 L100 142 L72 100 Z"/>
    <circle cx="100" cy="100" r="16"/>
  </g>
  <g stroke="#2DD4BF" stroke-width="0.7" opacity="0.85">
    <path d="M10 100 H190"/>
    <path d="M100 10 V190"/>
    <path d="M30 30 L170 170"/>
    <path d="M170 30 L30 170"/>
  </g>
</svg>
