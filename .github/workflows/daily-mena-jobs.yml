# Daily MENA ATS sweep.
# Vercel Hobby was failing production deploys with vercel.json crons, so this
# Action is the scheduler. Requires GitHub Actions secret CRON_SECRET — same
# value as Vercel CRON_SECRET.

name: Daily MENA jobs fetch

on:
  schedule:
    # 04:15 UTC — after backup cron (02:00), before morning traffic
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      ticks:
        description: 'How many fetch ticks (each covers ~8 boards, oldest first)'
        required: false
        default: '5'

concurrency:
  group: mena-jobs-fetch
  cancel-in-progress: false

jobs:
  fetch:
    name: Sweep ATS boards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Full catalog sweep
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
          TICKS: ${{ github.event.inputs.ticks || '5' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Missing repo secret CRON_SECRET (must match Vercel CRON_SECRET)"
            exit 1
          fi
          BASE="${SITE_URL:-https://muqabaleh.com}"
          BASE="${BASE%/}"
          echo "Target: $BASE  ticks: $TICKS"

          total_upserted=0
          total_companies=0
          total_errors=0

          i=1
          while [ "$i" -le "$TICKS" ]; do
            echo "── Tick $i/$TICKS ──"
            # Do not pass sync=1. Full catalog upsert + fetch exceeds Hobby's 60s
            # limit and 504s. Empty-table sync still runs inside fetch-cron.
            # Do not use curl -f — 504 bodies were hidden and retries still fail closed.
            resp_file="/tmp/ats-tick-$i.json"
            code="$(curl -sS -o "$resp_file" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Accept: application/json" \
              --retry 3 \
              --retry-delay 15 \
              --retry-all-errors \
              --max-time 70 \
              "${BASE}/api/jobs/fetch-cron?limit=8&source=github-daily" || true)"
            echo "HTTP $code"
            cat "$resp_file"
            echo
            if [ "$code" != "200" ]; then
              echo "::error::fetch-cron tick $i returned HTTP $code"
              exit 1
            fi
            resp="$(cat "$resp_file")"
            upserted=$(echo "$resp" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('upserted',0))")
            companies=$(echo "$resp" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('companies',0))")
            errors=$(echo "$resp" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('errors') or []))")
            total_upserted=$((total_upserted + upserted))
            total_companies=$((total_companies + companies))
            total_errors=$((total_errors + errors))
            if [ "$i" -lt "$TICKS" ]; then
              # Let Vercel function cool down; boards also rate-limit ~1 rps
              sleep 65
            fi
            i=$((i + 1))
          done

          echo "Done. companies_seen≈$total_companies upserted=$total_upserted errors=$total_errors"
          if [ "$total_errors" -gt 8 ]; then
            echo "::warning::High error count — check Admin → ATS Aggregator"
          fi
