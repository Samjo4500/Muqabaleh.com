<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" fill="none">
  <!-- Ornate Arabian corner: arch frame + najma + soft vine arabesque -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="420" y2="420">
      <stop offset="0%" stop-color="#F0D9A0" stop-opacity="1"/>
      <stop offset="55%" stop-color="#E8C97A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- outer arch border -->
  <path d="M36 360 V120 C36 48 48 36 120 36 H360" stroke="url(#g)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M56 360 V128 C56 68 68 56 128 56 H360" stroke="#E8C97A" stroke-width="1.1" opacity="0.65"/>

  <!-- mashrabiya lattice block -->
  <g stroke="#E8C97A" stroke-width="1" opacity="0.9">
    <path d="M80 80 H220 V220 H80 Z"/>
    <path d="M80 150 H220"/>
    <path d="M150 80 V220"/>
    <path d="M80 80 L220 220"/>
    <path d="M220 80 L80 220"/>
    <circle cx="150" cy="150" r="42"/>
    <path d="M150 108 L182 150 L150 192 L118 150 Z"/>
  </g>

  <!-- 8-point star medallion -->
  <g transform="translate(250 70)" stroke="#F0D9A0" stroke-width="1.15" fill="none">
    <path d="M50 4 L60 34 L92 34 L66 52 L76 84 L50 64 L24 84 L34 52 L8 34 L40 34 Z"/>
    <circle cx="50" cy="48" r="12" stroke="#2DD4BF" stroke-width="0.9"/>
  </g>

  <!-- flowing vegetal arabesque (stylized, not literal calligraphy) -->
  <g stroke="#E8C97A" stroke-width="1.15" fill="none" opacity="0.8" stroke-linecap="round">
    <path d="M70 280 C110 250 140 300 180 270 C210 248 230 290 270 275"/>
    <path d="M100 300 C130 275 155 320 190 295"/>
    <path d="M160 255 C175 235 195 235 208 252 C220 268 240 265 252 248"/>
    <path d="M210 288 C230 270 250 295 275 280"/>
    <!-- leaf curls -->
    <path d="M176 268 C186 258 198 262 200 274"/>
    <path d="M248 274 C258 264 270 268 272 280"/>
  </g>

  <!-- small teal accents -->
  <g fill="#2DD4BF" opacity="0.55">
    <circle cx="150" cy="150" r="2.5"/>
    <circle cx="300" cy="118" r="2"/>
    <circle cx="230" cy="270" r="2"/>
  </g>
</svg>
